<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KYOTO — Check List Diario</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;600&family=Noto+Sans+JP:wght@300;400;500&family=DM+Mono:wght@400&display=swap" rel="stylesheet" />
  <style>
    :root {
      --red:    #c3002f;
      --red-dk: #9a0025;
      --white:  #ffffff;
      --off:    #f5f5f5;
      --gray:   #888;
      --border: #ddd;
      --text:   #1a1a1a;
      --shadow: 0 2px 12px rgba(0,0,0,.08);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Noto Sans JP', sans-serif;
      background: var(--off);
      color: var(--text);
      min-height: 100vh;
    }

    /* HEADER */
    .header {
      background: var(--white);
      border-bottom: 3px solid var(--red);
      padding: 14px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: var(--shadow);
    }
    .header-left { display: flex; align-items: center; gap: 14px; }
    .logo-nissan { width: 52px; height: 52px; }
    .header-title h1 {
      font-family: 'Noto Serif JP', serif;
      font-size: 1.05rem;
      font-weight: 600;
      color: var(--red);
      letter-spacing: .05em;
    }
    .header-title p {
      font-size: .7rem;
      color: var(--gray);
      letter-spacing: .08em;
      text-transform: uppercase;
      margin-top: 2px;
    }
    .kanji {
      font-family: 'Noto Serif JP', serif;
      font-size: 1.5rem;
      color: var(--red);
      opacity: .2;
      letter-spacing: .1em;
    }

    /* CONTAINER */
    .container { max-width: 720px; margin: 0 auto; padding: 24px 16px 80px; }

    /* CARD */
    .card {
      background: var(--white);
      border-radius: 12px;
      box-shadow: var(--shadow);
      padding: 22px;
      margin-bottom: 18px;
    }
    .card-title {
      font-family: 'Noto Serif JP', serif;
      font-size: .75rem;
      text-transform: uppercase;
      letter-spacing: .12em;
      color: var(--gray);
      margin-bottom: 14px;
    }

    /* SUCURSAL */
    .sucursal-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    @media(max-width:480px){ .sucursal-grid { grid-template-columns: 1fr; } }
    .sucursal-btn {
      border: 2px solid var(--border);
      background: var(--white);
      border-radius: 8px;
      padding: 11px 14px;
      font-family: 'Noto Sans JP', sans-serif;
      font-size: .82rem;
      font-weight: 500;
      cursor: pointer;
      transition: all .17s;
      text-align: left;
      color: var(--text);
    }
    .sucursal-btn:hover { border-color: var(--red); color: var(--red); }
    .sucursal-btn.active { border-color: var(--red); background: var(--red); color: var(--white); }

    /* PROGRESS */
    .progress-bar { display: flex; gap: 8px; margin-bottom: 18px; }
    .progress-step {
      flex: 1;
      text-align: center;
      padding: 9px 4px;
      border-radius: 8px;
      border: 2px solid var(--border);
      font-size: .72rem;
      font-weight: 500;
      color: var(--gray);
      background: var(--white);
      transition: all .2s;
    }
    .progress-step.done   { color: #1a6640; border-color: #9ecfb5; background: #eef7f2; }
    .progress-step.active { color: #fff; border-color: var(--red); background: var(--red); }

    /* TURNO BANNER */
    .turno-banner {
      background: var(--red);
      color: var(--white);
      border-radius: 10px;
      padding: 14px 20px;
      margin-bottom: 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .turno-banner h2 {
      font-family: 'Noto Serif JP', serif;
      font-size: .98rem;
      font-weight: 600;
    }
    .turno-banner .hora {
      font-family: 'DM Mono', monospace;
      font-size: .84rem;
      opacity: .85;
    }

    /* AREA */
    .area-section { margin-bottom: 18px; }
    .area-header {
      font-family: 'Noto Serif JP', serif;
      font-size: .76rem;
      text-transform: uppercase;
      letter-spacing: .12em;
      color: var(--gray);
      margin-bottom: 10px;
      padding-left: 2px;
    }

    /* ITEM */
    .item-card {
      background: var(--white);
      border-radius: 10px;
      box-shadow: var(--shadow);
      padding: 13px 15px;
      margin-bottom: 8px;
    }
    .item-row { display: flex; align-items: flex-start; gap: 12px; }
    .item-label {
      flex: 1;
      font-size: .86rem;
      line-height: 1.5;
      padding-top: 5px;
    }
    .sino-btns { display: flex; gap: 6px; flex-shrink: 0; }
    .sino-btn {
      border: 2px solid var(--border);
      background: var(--white);
      border-radius: 6px;
      padding: 5px 13px;
      font-family: 'DM Mono', monospace;
      font-size: .78rem;
      font-weight: 500;
      cursor: pointer;
      transition: all .14s;
      color: var(--text);
    }
    .sino-btn.si:hover  { border-color: #1a6640; color: #1a6640; }
    .sino-btn.no:hover  { border-color: var(--red); color: var(--red); }
    .sino-btn.si.active { background: #1a6640; border-color: #1a6640; color: #fff; }
    .sino-btn.no.active { background: var(--red); border-color: var(--red); color: #fff; }

    .porque-field { margin-top: 10px; display: none; }
    .porque-field.show { display: block; }
    .porque-label { font-size: .73rem; color: var(--gray); margin-bottom: 5px; }
    .porque-field textarea {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 8px 10px;
      font-family: 'Noto Sans JP', sans-serif;
      font-size: .82rem;
      resize: vertical;
      min-height: 58px;
      color: var(--text);
    }
    .porque-field textarea:focus { outline: none; border-color: var(--red); }

    /* OBS */
    .obs-card {
      background: var(--white);
      border-radius: 10px;
      box-shadow: var(--shadow);
      padding: 13px 15px;
      margin-top: 4px;
    }
    .obs-card label { font-size: .76rem; color: var(--gray); display: block; margin-bottom: 6px; }
    .obs-card textarea {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 8px 10px;
      font-family: 'Noto Sans JP', sans-serif;
      font-size: .82rem;
      resize: vertical;
      min-height: 58px;
      color: var(--text);
    }
    .obs-card textarea:focus { outline: none; border-color: var(--red); }

    /* SUBMIT */
    .submit-wrap { text-align: center; margin-top: 10px; }
    .btn-submit {
      background: var(--red);
      color: var(--white);
      border: none;
      border-radius: 10px;
      padding: 14px 52px;
      font-family: 'Noto Serif JP', serif;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background .17s;
      letter-spacing: .04em;
    }
    .btn-submit:hover:not(:disabled) { background: var(--red-dk); }
    .btn-submit:disabled { background: var(--border); color: var(--gray); cursor: not-allowed; }

    /* MENSAJES */
    .completado-msg { text-align: center; padding: 32px 20px; }
    .completado-msg .icon { font-size: 2.8rem; margin-bottom: 12px; }
    .completado-msg h2 { font-family: 'Noto Serif JP', serif; color: #1a6640; margin-bottom: 6px; }
    .completado-msg p { color: var(--gray); font-size: .87rem; }

    .cerrado-msg { text-align: center; padding: 40px 20px; }
    .cerrado-msg .icon { font-size: 2.4rem; margin-bottom: 14px; }
    .cerrado-msg h2 { font-family: 'Noto Serif JP', serif; color: var(--red); margin-bottom: 8px; }
    .cerrado-msg p { color: var(--gray); font-size: .87rem; line-height: 1.6; }

    .turno-ok { text-align: center; padding: 28px 20px; }
    .turno-ok .icon { font-size: 2.2rem; margin-bottom: 10px; }
    .turno-ok h2 { font-family: 'Noto Serif JP', serif; color: #1a6640; margin-bottom: 6px; }
    .turno-ok p { color: var(--gray); font-size: .87rem; }

    .aviso-sucursal {
      text-align: center;
      color: var(--gray);
      padding: 28px 20px;
      font-size: .88rem;
    }

    /* TOAST */
    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(120px);
      background: #1a1a1a;
      color: #fff;
      padding: 12px 26px;
      border-radius: 8px;
      font-size: .84rem;
      transition: transform .3s ease;
      z-index: 999;
      white-space: nowrap;
    }
    .toast.show { transform: translateX(-50%) translateY(0); }
    .toast.ok   { background: #1a6640; }
    .toast.err  { background: var(--red); }

    .loading {
      text-align: center;
      padding: 60px 20px;
      color: var(--gray);
      font-family: 'Noto Serif JP', serif;
      letter-spacing: .1em;
      font-size: .9rem;
    }
  </style>
</head>
<body>

<header class="header">
  <div class="header-left">
    <svg class="logo-nissan" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
      <ellipse cx="60" cy="60" rx="56" ry="56" fill="none" stroke="#c3002f" stroke-width="5"/>
      <ellipse cx="60" cy="60" rx="42" ry="42" fill="none" stroke="#c3002f" stroke-width="2.5"/>
      <rect x="8" y="51" width="104" height="18" rx="3" fill="#fff"/>
      <rect x="8" y="51" width="104" height="18" rx="3" fill="none" stroke="#c3002f" stroke-width="2"/>
      <text x="60" y="65" text-anchor="middle" font-family="Arial Black, Arial" font-size="12" font-weight="900" fill="#c3002f" letter-spacing="2">NISSAN</text>
    </svg>
    <div class="header-title">
      <h1>KYOTO Automotores</h1>
      <p>Check List Diario · Protocolo de Recepción</p>
    </div>
  </div>
  <div class="kanji">おもてなし</div>
</header>

<div class="container">
  <div id="app"><div class="loading">CARGANDO...</div></div>
</div>

<div class="toast" id="toast"></div>

<script>
// ============================================================
// CONFIGURACIÓN
// ============================================================
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxZ60tb8xFXkYE3cq2dOBT15Jh3t_RI2la1YJ6ssu59tyqr7GJ6yAnJ3nYB5g03TKae/exec';

const SUCURSALES_LIST = [
  'KYOTO RESISTENCIA',
  'KYOTO CORRIENTES',
  'KYOTO POSADAS',
  'KYOTO SAENZ PEÑA'
];

const TURNO_CONFIG = {
  apertura: {
    nombre:        'Apertura (6hs - 13hs)',
    nombreSabado:  'Apertura Sábado (8:30 - 11:30)'
  },
  dia: {
    nombre:        'Día (13hs - 19hs)',
    nombreSabado:  null
  },
  cierre: {
    nombre:        'Cierre (19hs en adelante)',
    nombreSabado:  'Cierre Sábado (11:30 - 12:30)'
  }
};

const AREAS = {
  ventas: {
    apertura: [
      'Limpieza general (pisos, vidrios, escritorios)',
      'Autos exhibidos (limpios, con las fichas técnicas, consumo, patentes, calcos)',
      'Autos correctamente ubicados',
      'Pantallas / TVs funcionando',
      'Iluminación correcta',
      'Recepción ordenada',
      'Sala de espera limpia y ordenada',
      'Máquina de café limpia y funcionando',
      'Oficinas de Adm ordenadas',
      'Sala de entrega limpia y ordenada',
      'Baños limpios',
      'Sala de reuniones limpia y ordenada',
      'Estacionamiento de clientes'
    ],
    dia: [
      'Todo el personal posee identificador y ropa adecuada',
      'Escritorios ordenados',
      'Clientes atendidos sin demora',
      'Música / ambiente adecuado',
      'Baños limpios',
      'Estacionamiento gerentes'
    ],
    cierre: [
      'Salón ordenado',
      'Sala de reuniones ordenada y limpia',
      'Equipos apagados',
      'Documentación guardada',
      'Luces exteriores y cartelería funcionando'
    ]
  },
  posventa: {
    apertura: [
      'Limpieza general (pisos, vidrios, escritorios)',
      'Asesores con uniforme e identificador',
      'Pantallas de turnos encendida con los turnos del día',
      'Iluminación correcta',
      'Recepción ordenada',
      'Clientes atendidos sin demora'
    ],
    dia: [
      'Clientes atendidos sin demora'
    ],
    cierre: [
      'Documentación guardada',
      'Limpieza general (pisos, vidrios, escritorios)'
    ],
    aperturaSabado: [
      'Limpieza general (pisos, vidrios, escritorios)',
      'Recepción ordenada'
    ],
    cierreSabado: [
      'Documentación guardada'
    ]
  }
};

// ============================================================
// ESTADO
// ============================================================
let state = {
  sucursal:    null,
  turnoActual: null,
  completados: { apertura: false, dia: false, cierre: false },
  ventas:      { sinoState: {}, porques: {} },
  posventa:    { sinoState: {}, porques: {} }
};

// ============================================================
// FECHA Y TURNO
// ============================================================
function getTodayKey() {
  const d = new Date();
  return d.getFullYear() + '-' +
    String(d.getMonth() + 1).padStart(2, '0') + '-' +
    String(d.getDate()).padStart(2, '0');
}

function formatDate(str) {
  const p = str.split('-');
  return p[2] + '/' + p[1] + '/' + p[0];
}

function getDayType() {
  const day = new Date().getDay();
  if (day === 0) return 'domingo';
  if (day === 6) return 'sabado';
  return 'semana';
}

function getTurnoActual() {
  const now = new Date();
  const min = now.getHours() * 60 + now.getMinutes();
  const h   = now.getHours();
  const day = getDayType();

  if (day === 'semana') {
    if (h >= 6  && h < 13) return 'apertura';
    if (h >= 13 && h < 19) return 'dia';
    return 'cierre';
  }
  if (day === 'sabado') {
    if (min >= 8*60+30  && min < 11*60+30) return 'apertura';
    if (min >= 11*60+30 && min < 12*60+30) return 'cierre';
    return null;
  }
  return null;
}

function getNombreTurno() {
  const turno = state.turnoActual;
  if (!turno) return '';
  const esSabado = getDayType() === 'sabado';
  if (esSabado && TURNO_CONFIG[turno].nombreSabado) return TURNO_CONFIG[turno].nombreSabado;
  return TURNO_CONFIG[turno].nombre;
}

function isAllDone() {
  if (getDayType() === 'sabado') return state.completados.apertura && state.completados.cierre;
  return state.completados.apertura && state.completados.dia && state.completados.cierre;
}

// ============================================================
// PREGUNTAS — sábado tiene preguntas distintas en Posventa
// ============================================================
function getPreguntas(area) {
  const esSabado = getDayType() === 'sabado';
  if (esSabado && area === 'posventa') {
    const key = state.turnoActual + 'Sabado';
    return AREAS[area][key] || AREAS[area][state.turnoActual];
  }
  return AREAS[area][state.turnoActual];
}

// ============================================================
// LOCAL STORAGE
// ============================================================
function guardarEstado() {
  localStorage.setItem('kyoto_state_' + getTodayKey(), JSON.stringify(state));
}

function cargarEstado() {
  try {
    const raw = localStorage.getItem('kyoto_state_' + getTodayKey());
    if (raw) {
      const saved = JSON.parse(raw);
      state = Object.assign(state, saved);
    }
  } catch(e) {}
}

// ============================================================
// RENDER
// ============================================================
function renderApp() {
  const app = document.getElementById('app');
  let html  = '';

  // Selector de sucursal (siempre visible)
  html += '<div class="card">';
  html += '<div class="card-title">Seleccioná tu sucursal</div>';
  html += '<div class="sucursal-grid">';
  SUCURSALES_LIST.forEach(function(s) {
    const a = state.sucursal === s ? ' active' : '';
    html += '<button class="sucursal-btn' + a + '" onclick="seleccionarSucursal(\'' + s + '\')">' + s + '</button>';
  });
  html += '</div></div>';

  // Día completo
  if (state.sucursal && isAllDone()) {
    html += renderDiaCompleto();
    app.innerHTML = html;
    return;
  }

  // Domingo
  if (getDayType() === 'domingo') {
    html += '<div class="card cerrado-msg"><div class="icon">🏮</div>' +
            '<h2>Domingo</h2><p>Hoy no hay operaciones programadas.<br>El check list estará disponible el lunes.</p></div>';
    app.innerHTML = html;
    return;
  }

  // Sábado fuera de horario
  if (getDayType() === 'sabado' && !state.turnoActual) {
    html += '<div class="card cerrado-msg"><div class="icon">🏮</div>' +
            '<h2>Fuera de horario</h2>' +
            '<p>El sábado opera en dos turnos:<br>Apertura: 8:30 – 11:30 · Cierre: 11:30 – 12:30</p></div>';
    app.innerHTML = html;
    return;
  }

  // Progress bar
  html += renderProgress();

  // Turno banner
  html += '<div class="turno-banner"><h2>' + getNombreTurno() + '</h2>' +
          '<span class="hora" id="horaLive"></span></div>';

  // Turno ya completado
  if (state.completados[state.turnoActual]) {
    html += '<div class="card turno-ok">' +
            '<div class="icon">✅</div>' +
            '<h2>Turno registrado</h2>' +
            '<p>Este turno ya fue guardado correctamente.</p></div>';
    app.innerHTML = html;
    actualizarHora();
    return;
  }

  // Sin sucursal seleccionada
  if (!state.sucursal) {
    html += '<div class="card aviso-sucursal">Seleccioná una sucursal para continuar.</div>';
    app.innerHTML = html;
    return;
  }

  // Sección VENTAS
  html += '<div class="area-section">';
  html += '<div class="area-header">▸ Ventas</div>';
  getPreguntas('ventas').forEach(function(label, idx) {
    html += renderItem('ventas', idx, label);
  });
  html += '<div class="obs-card">' +
          '<label>Observaciones generales de Ventas (opcional)</label>' +
          '<textarea id="obsVentas" placeholder="Comentarios adicionales..."></textarea>' +
          '</div></div>';

  // Sección POSVENTA
  html += '<div class="area-section">';
  html += '<div class="area-header">▸ Posventa</div>';
  getPreguntas('posventa').forEach(function(label, idx) {
    html += renderItem('posventa', idx, label);
  });
  html += '<div class="obs-card">' +
          '<label>Observaciones generales de Posventa (opcional)</label>' +
          '<textarea id="obsPosventa" placeholder="Comentarios adicionales..."></textarea>' +
          '</div></div>';

  // Botón enviar
  html += '<div class="submit-wrap">' +
          '<button class="btn-submit" id="btnSubmit" onclick="enviarTurno()">Guardar Turno</button>' +
          '</div>';

  app.innerHTML = html;

  // Restaurar estado visual de botones SI/NO (solo si el usuario ya respondió)
  ['ventas', 'posventa'].forEach(function(area) {
    getPreguntas(area).forEach(function(_, idx) {
      const val = state[area].sinoState[idx];
      if (!val) return;  // sin respuesta → ningún botón se marca
      const btn = document.querySelector('[data-area="' + area + '"][data-idx="' + idx + '"][data-val="' + val + '"]');
      if (btn) btn.classList.add('active');
      if (val === 'NO') {
        const pq = document.getElementById('pq_' + area + '_' + idx);
        if (pq) {
          pq.classList.add('show');
          const ta = pq.querySelector('textarea');
          if (ta && state[area].porques[idx]) ta.value = state[area].porques[idx];
        }
      }
    });
  });

  actualizarHora();
}

function renderItem(area, idx, label) {
  return '<div class="item-card">' +
    '<div class="item-row">' +
    '<span class="item-label">' + label + '</span>' +
    '<div class="sino-btns">' +
    '<button class="sino-btn si" data-area="' + area + '" data-idx="' + idx + '" data-val="SI" ' +
      'onclick="marcarSino(\'' + area + '\',' + idx + ',\'SI\')">SI</button>' +
    '<button class="sino-btn no" data-area="' + area + '" data-idx="' + idx + '" data-val="NO" ' +
      'onclick="marcarSino(\'' + area + '\',' + idx + ',\'NO\')">NO</button>' +
    '</div></div>' +
    '<div class="porque-field" id="pq_' + area + '_' + idx + '">' +
    '<div class="porque-label">¿Por qué? Describí el motivo...</div>' +
    '<textarea onchange="guardarPorque(\'' + area + '\',' + idx + ',this.value)" ' +
      'placeholder="Describí el motivo..."></textarea>' +
    '</div></div>';
}

function renderProgress() {
  const esSabado = getDayType() === 'sabado';
  const pasos = esSabado
    ? [['apertura','Apertura'],['cierre','Cierre']]
    : [['apertura','Apertura'],['dia','Día'],['cierre','Cierre']];

  let html = '<div class="progress-bar">';
  pasos.forEach(function(p) {
    let cls = '';
    if (state.completados[p[0]])        cls = ' done';
    else if (state.turnoActual === p[0]) cls = ' active';
    html += '<div class="progress-step' + cls + '">' + p[1] + '</div>';
  });
  return html + '</div>';
}

function renderDiaCompleto() {
  return '<div class="card completado-msg">' +
    '<div class="icon">🎌</div>' +
    '<h2>¡Día completado!</h2>' +
    '<p>Todos los turnos fueron registrados correctamente.<br>' +
    formatDate(getTodayKey()) + ' · ' + (state.sucursal || '') + '</p>' +
    '</div>';
}

// ============================================================
// INTERACCIONES
// ============================================================
function seleccionarSucursal(suc) {
  state.sucursal = suc;
  guardarEstado();
  renderApp();
}

function marcarSino(area, idx, val) {
  state[area].sinoState[idx] = val;
  guardarEstado();

  const btns = document.querySelectorAll('[data-area="' + area + '"][data-idx="' + idx + '"]');
  btns.forEach(function(b) {
    b.classList.toggle('active', b.dataset.val === val);
  });

  const pq = document.getElementById('pq_' + area + '_' + idx);
  if (pq) pq.classList.toggle('show', val === 'NO');
}

function guardarPorque(area, idx, val) {
  state[area].porques[idx] = val;
  guardarEstado();
}

// ============================================================
// BUILD PAYLOAD
// ============================================================
function buildItems(area) {
  return getPreguntas(area).map(function(label, idx) {
    const respuesta = state[area].sinoState[idx] || '';
    return {
      item:      label,
      ok:        respuesta === 'SI',
      respuesta: respuesta,
      porque:    state[area].porques[idx] || ''
    };
  });
}

function buildObs(id) {
  const el = document.getElementById(id);
  return el ? el.value.trim() : '';
}

// ============================================================
// ENVIAR
// ============================================================
async function enviarTurno() {
  if (!state.sucursal) return;

  const faltantes = [];
  ['ventas', 'posventa'].forEach(function(area) {
    getPreguntas(area).forEach(function(_, idx) {
      if (!state[area].sinoState[idx]) faltantes.push(area + ' #' + (idx+1));
    });
  });
  if (faltantes.length > 0) {
    mostrarToast('✗ Faltan responder ' + faltantes.length + ' pregunta(s)', 'err');
    return;
  }

  const btn = document.getElementById('btnSubmit');
  if (btn) { btn.disabled = true; btn.textContent = 'Guardando...'; }

  const payload = {
    accion:        'guardarTurno',
    fecha:         getTodayKey(),
    hora:          new Date().toLocaleTimeString('es-AR'),
    sucursal:      state.sucursal,
    turno:         state.turnoActual,
    turnoNombre:   getNombreTurno(),
    itemsVentas:   JSON.stringify(buildItems('ventas')),
    obsVentas:     buildObs('obsVentas'),
    itemsPosventa: JSON.stringify(buildItems('posventa')),
    obsPosventa:   buildObs('obsPosventa')
  };

  try {
    const res  = await fetch(SCRIPT_URL, {
      method:   'POST',
      headers:  { 'Content-Type': 'text/plain' },
      body:     JSON.stringify(payload),
      redirect: 'follow'
    });
    const json = await res.json();
    if (json.ok !== false) {
      state.completados[state.turnoActual] = true;
      state.ventas   = { sinoState: {}, porques: {} };
      state.posventa = { sinoState: {}, porques: {} };
      guardarEstado();
      mostrarToast('✓ Turno guardado correctamente', 'ok');
      setTimeout(renderApp, 1200);
    } else {
      throw new Error(json.error || 'Error desconocido');
    }
  } catch(e) {
    mostrarToast('✗ Error al guardar. Verificá la conexión.', 'err');
    if (btn) { btn.disabled = false; btn.textContent = 'Guardar Turno'; }
  }
}

// ============================================================
// UTILIDADES
// ============================================================
function mostrarToast(msg, tipo) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className   = 'toast ' + (tipo || '');
  t.classList.add('show');
  setTimeout(function() { t.classList.remove('show'); }, 3000);
}

function actualizarHora() {
  const el = document.getElementById('horaLive');
  if (!el) return;
  el.textContent = new Date().toLocaleTimeString('es-AR', { hour: '2-digit', minute: '2-digit' });
  setTimeout(actualizarHora, 15000);
}

// ============================================================
// INIT
// ============================================================
function initApp() {
  cargarEstado();
  state.turnoActual = getTurnoActual();
  renderApp();
}

window.addEventListener('load', initApp);
</script>
